services:
  # 1. Backend API Service (Runs your Python AI / ML models)
  - type: web
    name: terrapulse-backend
    env: docker
    region: singapore
    plan: free
    dockerContext: apps/terrapulse/backend
    dockerfilePath: apps/terrapulse/backend/Dockerfile
    autoDeploy: false
    envVars:
      - key: PORT
        value: "10000"

  # 2. Frontend React Service (Hosted 100% FREE as a Static Site)
  - type: static
    name: terrapulse-frontend
    region: singapore
    rootDir: apps/terrapulse/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      # Automatically pass the Backend's Render URL into the Frontend build step!
      - key: VITE_API_URL
        fromService:
          type: web
          name: terrapulse-backend
          envVarKey: RENDER_EXTERNAL_URL
    
    # Crucial for React Router so sub-pages don't 404 on refresh
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
